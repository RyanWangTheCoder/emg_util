session:
  log_dir: ''
  emg_glob: emg_log_*.csv
  imu_glob: imu_log_*.csv
  vitals_path: vitals_log.csv
  emg_fs_hz: 2000
  imu_fs_fallback_hz: 200
  use_physical_units: true
  acc_fsr_default_g: 4      # matches firmware IMU_ACC_FSR_G=4 (was 2, saturated)
  gyro_fsr_default_dps: 1000  # matches firmware IMU_GYRO_FSR_DPS=1000 (was 250, saturated)
  out_dir: out
  # Optional human-readable label for this tennis session (used in plot titles)
  label: ''
features:
  mode: both
  compute_windowed: false
  zc_thr: 0.01
  ssc_thr: 0.01
swing_detection:
  use_gyro: true
  baseline_s: 2.0
  z_thr: 5.0
  min_consec: 3
  min_gap_ms: 300
  pre_ms: 250
  post_ms: 450
  mdf_pad_ms: 300
baseline:
  mode: swing
  warmup_skip_min: 10
  warmup_skip_swings: 0
  baseline_swings: 20
  baseline_window_sec: 60
bout:
  gap_thr_s: 10
  gap_thr_long_s: 30
  rest_dur_s: 4
  imu_z_low: 1.2
  imu_z_high: 2.5
  emg_env_low_pct: 25
  emg_env_high_pct: 60
  merge_short_rest_s: 6
  min_bout_swings: 3
plots:
  enable: true
  full_duration: true
  emg_max_points: 300000
  do_fatigue: true
  win_sec: 1.0
  step_sec: 0.25
  paged:
    enable: false
    page_sec: 5.0
    page_start_sec: 0.0
    page_count: 0
    page_step_sec: null
diagnostics:
  swing_overlay:
    enable: true
    save_name: swing_overlay.png
    plot_env_mean: true
    two_y_axes: true
  emg_imu_correlation:
    enable: true
    method: pearson
    save_name: emg_imu_correlation.json
  activity_overlay:
    enable: true
    save_name: imu_activity_overlay.png
    plot_swings: true
    plot_signal: intensity
activity_gating:
  enable: true
  mode: work_period
  intensity: hybrid
  w_gyro: 0.8
  w_acc: 0.2
  acc_dyn_method: abs_mag_minus_1g
  smooth_ms: 250
  expand_ms: 400
  p_high: 90
  p_low: 75
  min_active_ms: 1000
  merge_gap_ms: 2000
  skip_min: 0
  filter_swings: false


health:
  # Enable EMG health detection (zeros/flatline/gaps) for sporadic contact issues
  enable: true
  # Fixed health window (seconds)
  window_s: 1.0
  # Require persistence before declaring a BAD interval
  bad_persist_s: 2.0
  # EMG BAD thresholds
  emg_zero_frac_bad: 0.9
  emg_flat_std_bad: 1.0
  emg_gap_bad_us: 200000

  # New knob: filter out swing windows that overlap BAD EMG intervals
  filter_swings_by_emg_bad: true
