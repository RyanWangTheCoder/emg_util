session:
  log_dir: ''
  emg_glob: emg_log_*.csv
  imu_glob: imu_log_*.csv
  vitals_path: vitals_log.csv
  emg_fs_hz: 2000
  imu_fs_fallback_hz: 200
  use_physical_units: true
  acc_fsr_default_g: 8      # matches current hardware: ±8g (was 4, then 2)
  gyro_fsr_default_dps: 2000  # matches current hardware: ±2000 dps (was 1000, then 250)
  out_dir: out
  # Optional human-readable label for this tennis session (used in plot titles)
  label: ''
features:
  mode: both
  compute_windowed: false
  zc_thr: 0.01
  ssc_thr: 0.01
swing_detection:
  use_gyro: true
  thr_gyro_dps: 300       # fixed gyro threshold in dps (replaces z-score)
  thr_acc_g: 0.0          # optional acc gate in g (0=disabled, 1.5=strict)
  min_gap_ms: 2000        # min ms between swings -- matches plotter debounce=2s
  # legacy z-score params (no longer used): baseline_s, z_thr, min_consec
  pre_ms: 250
  post_ms: 450
  mdf_pad_ms: 300
  # E1: Ball-impact window masking (Appendix E1 in paper.md)
  # When acc_dyn peaks above this threshold within the swing window, mask
  # +-impact_mask_half_ms around the impact before Welch PSD.
  # Set to 0.0 to disable (backward-compatible default).
  impact_mask_thr_g: 0.0    # g; 3.0 recommended for tennis; 0 = disabled
  impact_mask_half_ms: 20   # ms; half-width of masked region around impact peak
baseline:
  mode: swing
  warmup_skip_min: 10
  warmup_skip_swings: 0
  baseline_swings: 20
  baseline_window_sec: 60
bout:
  gap_thr_s: 10
  gap_thr_long_s: 30
  rest_dur_s: 4
  imu_z_low: 1.2
  imu_z_high: 2.5
  emg_env_low_pct: 25
  emg_env_high_pct: 60
  merge_short_rest_s: 6
  min_bout_swings: 3
plots:
  enable: true
  full_duration: true
  emg_max_points: 300000
  do_fatigue: true
  win_sec: 1.0
  step_sec: 0.25
  paged:
    enable: false
    page_sec: 5.0
    page_start_sec: 0.0
    page_count: 0
    page_step_sec: null
diagnostics:
  swing_overlay:
    enable: true
    save_name: swing_overlay.png
    plot_env_mean: true
    two_y_axes: true
  emg_imu_correlation:
    enable: true
    method: pearson
    save_name: emg_imu_correlation.json
  activity_overlay:
    enable: true
    save_name: imu_activity_overlay.png
    plot_swings: true
    plot_signal: intensity
activity_gating:
  enable: true
  mode: work_period
  intensity: hybrid
  w_gyro: 0.8
  w_acc: 0.2
  acc_dyn_method: abs_mag_minus_1g
  smooth_ms: 250
  expand_ms: 400
  p_high: 90
  p_low: 75
  min_active_ms: 1000
  merge_gap_ms: 2000
  skip_min: 0
  filter_swings: false


health:
  # Enable EMG health detection (zeros/flatline/gaps) for sporadic contact issues
  enable: true
  # Fixed health window (seconds)
  window_s: 1.0
  # Require persistence before declaring a BAD interval
  bad_persist_s: 2.0
  # EMG BAD thresholds
  emg_zero_frac_bad: 0.9
  emg_flat_std_bad: 1.0
  emg_gap_bad_us: 200000

  # New knob: filter out swing windows that overlap BAD EMG intervals
  filter_swings_by_emg_bad: true

env_gating:
  # ENV-based activation gating for MDF/MNF windows (sports EMG best practice)
  # ENV = MyoWare envelope output (rectified + low-passed ~3.6 Hz)
  # Use ENV to detect "muscle active" vs "rest" periods
  # MDF/MNF computed only on RAW during ENV-active + IMU-stable windows
  enable: true  # set true to enable ENV gating for MDF/MNF
  
  # Threshold mode: 'percentile' (session-adaptive) or 'absolute' (fixed value)
  mode: percentile
  
  # Percentile-based threshold (recommended for sports with varying intensity)
  # Compute threshold as percentile of 1s ENV windows across full session
  # p75 = upper quartile (conservative: keeps ~25% of time as "active")
  # p50 = median (moderate: keeps ~50% of time)
  # p25 = lower quartile (permissive: keeps ~75% of time)
  percentile: 75
  
  # Absolute threshold (ADC units, 0-4095 for 12-bit)
  # Only used if mode='absolute'
  # From log0305: p75(env_mean) ≈ 1651, p50 ≈ 1223, p25 ≈ 700
  absolute_threshold: 1651
  
  # Window size for computing ENV mean (seconds)
  # Should match MDF/MNF window size for consistency
  window_sec: 1.0
  
  # Apply ENV gate to: 'mdf_only', 'baseline_only', or 'both'
  # mdf_only: gate per-swing MDF/MNF windows (recommended)
  # baseline_only: gate baseline swing selection only
  # both: gate both baseline and per-swing MDF/MNF
  apply_to: mdf_only
