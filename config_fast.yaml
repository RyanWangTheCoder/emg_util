# ============================================================
# EMG + IMU Analysis Configuration (single YAML)
#
# NEW btCentral.py capture format (separate rotated EMG / IMU logs).
# - Pass capture directory via CLI: --log-dir <LOG_DIR>
# - Runner outputs to out/<session_id>/...
# ============================================================

session:
  log_dir: ""  # leave empty; pass via CLI --log-dir
  emg_glob: "emg_log_*.csv"
  imu_glob: "imu_log_*.csv"
  vitals_path: "vitals_log.csv"  # optional

  emg_fs_hz: 2000
  imu_fs_fallback_hz: 200

  use_physical_units: true
  acc_fsr_default_g: 2
  gyro_fsr_default_dps: 250

  out_dir: "out"

features:
  mode: "bout"  # swing | bout | both
  compute_windowed: false
  zc_thr: 0.01
  ssc_thr: 0.01

swing_detection:
  use_gyro: true
  baseline_s: 2.0
  z_thr: 5.0
  min_consec: 3
  min_gap_ms: 300
  pre_ms: 250
  post_ms: 450
  mdf_pad_ms: 300

baseline:
  mode: "swing"
  warmup_skip_min: 5
  warmup_skip_swings: 0
  baseline_swings: 20
  baseline_window_sec: 60

bout:
  gap_thr_s: 10
  gap_thr_long_s: 30
  rest_dur_s: 4
  imu_z_low: 1.2
  imu_z_high: 2.5
  emg_env_low_pct: 25
  emg_env_high_pct: 60
  merge_short_rest_s: 6
  min_bout_swings: 3

plots:
  enable: false
  full_duration: true
  emg_max_points: 300000
  do_fatigue: true
  win_sec: 1.0
  step_sec: 0.25
  paged:
    enable: false
    page_sec: 5.0
    page_start_sec: 0.0
    page_count: 0
    page_step_sec: null

diagnostics:
  swing_overlay:
    enable: true
    save_name: swing_overlay.png
    plot_env_mean: true
    two_y_axes: true
  emg_imu_correlation:
    enable: false
    method: pearson
    save_name: emg_imu_correlation.json
