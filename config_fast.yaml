# ============================================================
# EMG + IMU Analysis Configuration (FAST / MEDIUM MODE)
#
# NEW btCentral.py capture format (separate rotated EMG / IMU logs).
# - Pass capture directory via CLI: --log-dir <LOG_DIR>
# - The entire folder is treated as ONE tennis session (all BLE connections stitched).
# - Runner outputs to out/ (flat, no per-capture subdirectories).
#
# Three analysis modes (set features.mode):
#   "bout"   — IMU-only: swing detection + bout summary. No EMG processing.
#              Fastest. ~60s for 70min session (mostly I/O).
#   "medium" — Adds per-swing EMG envelope + MDF + RMS + windowed RMS trend.
#              Key fatigue indicators without full feature set. ~2-3s extra.
#   "both"   — Full per-swing EMG features (mdf, rms, mav, wl, zc, ssc, mnf).
#              Use config.yaml for full mode.
#
# This file defaults to "medium" — fast enough for daily use, enough EMG
# insight to track fatigue trends.
# ============================================================

session:
  log_dir: ""  # leave empty; pass via CLI --log-dir
  emg_glob: "emg_log_*.csv"
  imu_glob: "imu_log_*.csv"
  vitals_path: "vitals_log.csv"  # optional

  emg_fs_hz: 2000
  imu_fs_fallback_hz: 200

  use_physical_units: true
  acc_fsr_default_g: 2
  gyro_fsr_default_dps: 250

  out_dir: "out"
  # Optional human-readable label for this tennis session (used in plot titles)
  label: ""

features:
  mode: "medium"  # "bout" = IMU-only | "medium" = envelope+MDF+RMS | "both" = full EMG
  compute_windowed: false
  zc_thr: 0.01
  ssc_thr: 0.01
  # Windowed RMS parameters (used in medium mode for continuous fatigue trend)
  win_rms_s: 10.0   # window size in seconds
  step_rms_s: 5.0   # step size in seconds

swing_detection:
  use_gyro: true
  baseline_s: 2.0
  z_thr: 5.0
  min_consec: 3
  min_gap_ms: 300
  pre_ms: 250
  post_ms: 450
  mdf_pad_ms: 300

baseline:
  mode: "swing"
  warmup_skip_min: 5
  warmup_skip_swings: 0
  baseline_swings: 20
  baseline_window_sec: 60

bout:
  gap_thr_s: 10
  gap_thr_long_s: 30
  rest_dur_s: 4
  imu_z_low: 1.2
  imu_z_high: 2.5
  emg_env_low_pct: 25
  emg_env_high_pct: 60
  merge_short_rest_s: 6
  min_bout_swings: 3

plots:
  enable: false  # skip windowed EMG/IMU features + plots (set true for full analysis)
  full_duration: true
  emg_max_points: 300000
  do_fatigue: true
  win_sec: 1.0
  step_sec: 0.25
  paged:
    enable: false
    page_sec: 5.0
    page_start_sec: 0.0
    page_count: 0
    page_step_sec: null

diagnostics:
  swing_overlay:
    enable: true
    save_name: swing_overlay.png
    plot_env_mean: true
    two_y_axes: true
  emg_imu_correlation:
    enable: false  # ← FAST: skip correlation (set true for full analysis)
    method: pearson
    save_name: emg_imu_correlation.json
  activity_overlay:
    enable: true  # medium mode: enable activity overlay (fast, IMU-only)
    save_name: imu_activity_overlay.png
    plot_swings: true
    plot_signal: intensity  # 'intensity' or 'gyro_mag'

activity_gating:
  enable: true  # ← Keep enabled (fast; only computes intensity, no heavy I/O)
  mode: work_period
  intensity: hybrid
  w_gyro: 0.8
  w_acc: 0.2
  acc_dyn_method: abs_mag_minus_1g
  smooth_ms: 250
  expand_ms: 400
  p_high: 90
  p_low: 75
  min_active_ms: 1000
  merge_gap_ms: 2000
  skip_min: 0  # 0 = use baseline.warmup_skip_min
  filter_swings: false  # ← Keep false (filtering is fast; useful for downstream analysis)

health:
  # Medium mode: enable EMG health detection (EMG is loaded anyway for medium mode)
  # Set to false if using mode: "bout" (no EMG processing)
  enable: true
  window_s: 1.0
  bad_persist_s: 2.0
  emg_zero_frac_bad: 0.9
  emg_flat_std_bad: 1.0
  emg_gap_bad_us: 200000
  filter_swings_by_emg_bad: false
